services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tx
      POSTGRES_PASSWORD: tx
      POSTGRES_DB: tx_test
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
